<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ops board — HMS Command</title>
<link rel="stylesheet" href="/css/app.css?v=6">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><h1>HMS Command</h1><div class="sub">Hyperbaric Management</div></div>
    <nav class="nav">
      <div class="nav-section"><div class="nav-section-title">Overview</div><a href="/" class="nav-item" data-page="dashboard"><span class="nav-icon">◈</span><span>Dashboard</span></a></div>
      <div class="nav-section"><div class="nav-section-title">Operations</div>
        <a href="/modules/org-chart.html" class="nav-item" data-page="org-chart"><span class="nav-icon">⚙</span><span>Org Chart</span></a>
        <a href="/modules/map.html" class="nav-item" data-page="map"><span class="nav-icon">◎</span><span>Clinic Map</span><span class="nav-badge blue" id="map-badge">6</span></a>
        <a href="/modules/referrals.html" class="nav-item" data-page="referrals"><span class="nav-icon">⇄</span><span>Referrals</span><span class="nav-badge green" id="ref-badge">4</span></a>
        <a href="/modules/tasks.html" class="nav-item" data-page="tasks"><span class="nav-icon">☰</span><span>Tasks</span><span class="nav-badge" id="task-badge">3</span></a>
        <a href="/modules/ops-board.html" class="nav-item active" data-page="ops-board"><span class="nav-icon">▦</span><span>Ops board</span></a>
      </div>
      <div class="nav-section"><div class="nav-section-title">Analytics</div><a href="/modules/reports.html" class="nav-item" data-page="reports"><span class="nav-icon">▤</span><span>Reports</span></a></div>
    </nav>
    <div class="sidebar-footer">v1.0 · Auto-saving</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title">Ops cadence</div>
      <div class="topbar-actions">
        <div class="status-pill"><span class="status-dot" id="status-dot"></span><span id="status-text">Loading</span></div>
        <a class="btn btn-secondary btn-sm" id="linear-project-link" href="https://linear.app/healthi/project/ops-cadence-ebb195e01b21" target="_blank" rel="noopener">Open in Linear</a>
        <button class="btn btn-primary btn-sm" type="button" onclick="loadBoard()">↻ Refresh</button>
      </div>
    </header>
    <div class="content">
      <div id="ops-banner" class="ops-banner" hidden></div>
      <div class="cadence-toolbar">
        <div class="cadence-tabs" role="tablist">
          <button type="button" class="cadence-tab active" data-cadence="Daily" onclick="setCadence('Daily')">Daily</button>
          <button type="button" class="cadence-tab" data-cadence="Weekly" onclick="setCadence('Weekly')">Weekly</button>
          <button type="button" class="cadence-tab" data-cadence="Monthly" onclick="setCadence('Monthly')">Monthly</button>
        </div>
        <div class="filter-chips" id="owner-chips">
          <span class="filter-chips-label">People</span>
        </div>
      </div>
      <div class="section">
        <div class="section-header">
          <div class="section-title" id="list-title">Daily</div>
          <span class="badge badge-blue" id="issue-count">0</span>
        </div>
        <div class="section-body ops-card-body">
          <div class="ops-card-list" id="ops-card-list" role="list"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="ops-drawer-overlay" id="ops-drawer-overlay" hidden onclick="closeDrawer(event)">
  <aside class="ops-drawer" role="dialog" aria-modal="true" aria-labelledby="ops-drawer-title" onclick="event.stopPropagation()">
    <header class="ops-drawer-header">
      <div>
        <div class="ops-drawer-id" id="ops-drawer-id"></div>
        <h2 class="ops-drawer-title" id="ops-drawer-title"></h2>
      </div>
      <button type="button" class="panel-close ops-drawer-close" aria-label="Close drawer" onclick="closeDrawer()">×</button>
    </header>
    <div class="ops-drawer-body" id="ops-drawer-body"></div>
    <footer class="ops-drawer-footer">
      <a class="btn btn-primary btn-sm" id="ops-drawer-linear" href="#" target="_blank" rel="noopener">Open in Linear</a>
    </footer>
  </aside>
</div>

<script src="/js/app.js?v=4"></script>
<script src="/js/ops-board-format.js"></script>
<script>
let cadence = 'Daily';
let selectedOwners = new Set();
let ownerLabels = [];
let issues = [];
let activeIssueId = null;

async function loadBoard() {
  showStatus('status-text', 'saving', 'Loading');
  const banner = document.getElementById('ops-banner');
  banner.hidden = true;
  try {
    const res = await fetch('/api/ops-cadence');
    const json = await res.json();
    if (!json.success) throw new Error(json.error || 'Failed to load');
    issues = json.issues || [];
    ownerLabels = json.ownerLabels || [];
    if (json.project && json.project.url) {
      document.getElementById('linear-project-link').href = json.project.url;
    }
    renderOwnerChips();
    render();
    if (!json.configured) {
      banner.hidden = false;
      banner.className = 'ops-banner';
      banner.textContent = 'Demo data — set LINEAR_API_KEY on the server to load live Linear issues from the Ops cadence project. Tag issues with Cadence (Daily/Weekly/Monthly) and Owner (Rudy/Stacey/Mike/…) labels.';
      showStatus('status-text', 'warning', 'Demo');
      document.getElementById('status-dot').className = 'status-dot warning';
    } else {
      showStatus('status-text', '', 'Linear');
    }
  } catch (err) {
    issues = [];
    render();
    banner.hidden = false;
    banner.className = 'ops-banner error';
    banner.textContent = err.message || 'Could not load Ops cadence board.';
    showStatus('status-text', 'error', 'Error');
  }
}

function setCadence(next) {
  cadence = next;
  document.querySelectorAll('.cadence-tab').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.cadence === cadence);
  });
  render();
}

function toggleOwner(name) {
  if (selectedOwners.has(name)) selectedOwners.delete(name);
  else selectedOwners.add(name);
  renderOwnerChips();
  render();
}

function renderOwnerChips() {
  const wrap = document.getElementById('owner-chips');
  wrap.innerHTML = '';
  const label = document.createElement('span');
  label.className = 'filter-chips-label';
  label.textContent = 'People';
  wrap.appendChild(label);
  if (!ownerLabels.length) {
    const empty = document.createElement('span');
    empty.className = 'filter-chips-label';
    empty.textContent = 'No Owner labels';
    wrap.appendChild(empty);
    return;
  }
  ownerLabels.forEach((name) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip' + (selectedOwners.has(name) ? ' selected' : '');
    btn.textContent = name;
    btn.addEventListener('click', () => toggleOwner(name));
    wrap.appendChild(btn);
  });
}

function visibleIssues() {
  const owners = [...selectedOwners];
  return issues.filter((issue) => {
    if (!(issue.cadenceLabels || []).includes(cadence)) return false;
    if (!owners.length) return true;
    return (issue.ownerLabels || []).some((n) => owners.includes(n));
  });
}

function statusAccent(status, statusType) {
  const type = (statusType || '').toLowerCase();
  const s = (status || '').toLowerCase();
  if (type === 'completed' || s.includes('done')) return 'done';
  if (s.includes('block')) return 'blocked';
  if (type === 'started' || s.includes('progress')) return 'progress';
  if (type === 'unstarted' || s.includes('todo') || type === 'backlog' || s.includes('backlog')) return 'todo';
  return 'todo';
}

function metaPart(value, overdue) {
  if (!value || value === '—') return '—';
  if (overdue) return `<span class="due-overdue">${esc(value)}</span>`;
  return esc(value);
}

function renderOpsCard(issue) {
  const accent = statusAccent(issue.status, issue.statusType);
  const stream = issue.streamLabel || '—';
  const owner = (issue.ownerLabels || []).join(', ') || '—';
  const due = formatDue(issue.dueDate);
  const priority = issue.priority || '—';
  const meta = [
    metaPart(stream),
    metaPart(owner),
    metaPart(due.label, due.overdue),
    metaPart(priority)
  ].join('<span class="ops-meta-sep">·</span>');

  return `<article class="ops-card ops-accent-${accent}" role="listitem" tabindex="0" data-issue-id="${esc(issue.id)}" onclick="openIssue(this)" onkeydown="if(event.key==='Enter')openIssue(this)">
    <div class="ops-card-line1">${esc(issue.title)}</div>
    <div class="ops-card-line2">${meta}</div>
  </article>`;
}

function detailValue(value, overdue) {
  if (!value || value === '—') return '<span class="ops-detail-value">—</span>';
  if (overdue) return `<span class="ops-detail-value due-overdue">${esc(value)}</span>`;
  return `<span class="ops-detail-value">${esc(value)}</span>`;
}

function renderDrawerBody(issue) {
  const stream = issue.streamLabel || '—';
  const owner = (issue.ownerLabels || []).join(', ') || '—';
  const cadenceLabels = (issue.cadenceLabels || []).join(', ') || '—';
  const due = formatDue(issue.dueDate);
  const priority = issue.priority || '—';
  const status = issue.status || '—';
  const notes = (issue.description || '').trim();
  const notesHtml = notes
    ? `<div class="ops-detail-notes-body">${esc(notes)}</div>`
    : '<div class="ops-detail-notes-body ops-detail-notes-empty">No notes in Linear.</div>';

  return `<dl class="ops-detail-grid">
    <dt class="ops-detail-label">Status</dt><dd>${detailValue(status)}</dd>
    <dt class="ops-detail-label">Owner</dt><dd>${detailValue(owner)}</dd>
    <dt class="ops-detail-label">Cadence</dt><dd>${detailValue(cadenceLabels)}</dd>
    <dt class="ops-detail-label">Stream</dt><dd>${detailValue(stream)}</dd>
    <dt class="ops-detail-label">Due</dt><dd>${detailValue(due.label, due.overdue)}</dd>
    <dt class="ops-detail-label">Priority</dt><dd>${detailValue(priority)}</dd>
  </dl>
  <div class="ops-detail-notes">
    <div class="ops-detail-notes-label">Notes</div>
    ${notesHtml}
  </div>`;
}

function openIssue(row) {
  const id = row && row.dataset && row.dataset.issueId;
  if (!id) return;
  const issue = issues.find((i) => i.id === id);
  if (!issue) return;
  activeIssueId = id;
  document.getElementById('ops-drawer-id').textContent = issue.identifier || '';
  document.getElementById('ops-drawer-title').textContent = issue.title || '';
  document.getElementById('ops-drawer-body').innerHTML = renderDrawerBody(issue);
  const linearLink = document.getElementById('ops-drawer-linear');
  linearLink.href = issue.url || '#';
  linearLink.hidden = !issue.url;
  document.getElementById('ops-drawer-overlay').hidden = false;
  document.body.style.overflow = 'hidden';
  document.querySelector('.ops-drawer-close').focus();
}

function closeDrawer(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('ops-drawer-overlay').hidden = true;
  activeIssueId = null;
  document.body.style.overflow = '';
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !document.getElementById('ops-drawer-overlay').hidden) closeDrawer();
});

function render() {
  const rows = visibleIssues();
  document.getElementById('list-title').textContent = cadence;
  document.getElementById('issue-count').textContent = rows.length;
  const list = document.getElementById('ops-card-list');
  if (!rows.length) {
    list.innerHTML = '<div class="empty ops-empty">No open issues for this cadence' + (selectedOwners.size ? ' and people filter' : '') + '.</div>';
    return;
  }
  list.innerHTML = rows.map(renderOpsCard).join('');
}

loadBoard();
</script>
</body>
</html>

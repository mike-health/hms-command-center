services:
  - type: web
    name: hms-command-center
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: LINEAR_API_KEY
        sync: false
      - key: VISIT_HMAC_SECRET
        sync: false
      - key: VISIT_INGEST_URL
        sync: false
      - key: VISIT_INGEST_AUTH
        sync: false
